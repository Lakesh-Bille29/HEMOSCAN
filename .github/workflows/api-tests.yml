name: ⚙️ PHP REST API Integration Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  api-integration-suite:
    name: Run PHP REST API Integration Suite (350 Tests)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ""
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: brain_scan_db
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo, pdo_mysql, mysqli, gd, curl

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python AI Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ai-edge-litert numpy Pillow || pip install tflite-runtime numpy Pillow

      - name: Prepare Backend Configuration
        run: |
          BACKEND_DIR="Backend"
          if [ ! -d "$BACKEND_DIR" ]; then BACKEND_DIR="backend"; fi
          if [ ! -f "$BACKEND_DIR/config.php" ] && [ -f "$BACKEND_DIR/config.example.php" ]; then
            cp "$BACKEND_DIR/config.example.php" "$BACKEND_DIR/config.php"
          fi

      - name: Initialize Database & Import Schema
        run: |
          BACKEND_DIR="Backend"
          if [ ! -d "$BACKEND_DIR" ]; then BACKEND_DIR="backend"; fi
          mysql -h 127.0.0.1 -u root -e "CREATE DATABASE IF NOT EXISTS brain_scan_db;"
          if [ -f "$BACKEND_DIR/setup_db.sql" ]; then
            mysql -h 127.0.0.1 -u root brain_scan_db < "$BACKEND_DIR/setup_db.sql"
          fi
          if [ -f "$BACKEND_DIR/brain_scan_db.sql" ]; then
            mysql -h 127.0.0.1 -u root brain_scan_db < "$BACKEND_DIR/brain_scan_db.sql" || true
          fi

      - name: Create Reports Directory
        run: mkdir -p reports/api

      - name: Start PHP Built-in REST API Server
        run: |
          BACKEND_DIR="Backend"
          if [ ! -d "$BACKEND_DIR" ]; then BACKEND_DIR="backend"; fi
          php -S 127.0.0.1:8000 -t "$BACKEND_DIR" &
          for i in {1..15}; do
            if curl -s http://127.0.0.1:8000/ > /dev/null; then
              echo "PHP Built-in server ready on port 8000!"
              break
            fi
            echo "Waiting for PHP server..."
            sleep 1
          done

      - name: Install API Automation Dependencies
        run: |
          cd automation/api
          npm install

      - name: Run PHP REST API Suite (350 Tests)
        env:
          API_BASE_URL: "http://127.0.0.1:8000"
          DB_HOST: "127.0.0.1"
          DB_USER: "root"
          DB_PASSWORD: ""
          DB_NAME: "brain_scan_db"
        run: |
          cd automation/api
          npm test

      - name: Upload API Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-reports
          path: reports/api/
          retention-days: 14
