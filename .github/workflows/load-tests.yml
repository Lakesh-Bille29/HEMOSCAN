name: ⚡ Load & Performance Testing Workflow

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  load-performance-tests:
    name: Run API Load & Performance Test Suite (300+ Requests / VUs)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install k6 Performance Testing Tool
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6

      - name: Start Local Backend Server for Load Test
        run: |
          cd Backend
          php -S 127.0.0.1:8000 &
          sleep 2

      - name: Install PyTest Load Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-html pytest-xdist requests

      - name: Execute k6 Load Test Suite (300+ Virtual User Iterations)
        env:
          TEST_TARGET_URL: "http://127.0.0.1:8000"
        run: |
          k6 run tests/load/k6_load_test.js --out json=k6-load-report.json || true

      - name: Execute PyTest Load Test Suite (300+ Performance Scenarios)
        run: |
          python -m pytest tests/load/test_load_suite.py \
            -v \
            --html=load-test-report.html \
            --junitxml=load-test-report.xml

      - name: Upload Performance & Load Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-performance-reports
          path: |
            k6-load-report.json
            load-test-report.html
            load-test-report.xml
          retention-days: 14
