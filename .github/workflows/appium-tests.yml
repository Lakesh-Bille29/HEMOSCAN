name: 📱 Appium Mobile Testing Workflow

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  appium-mobile-tests:
    name: Build Android APK & Run Mobile Test Suite (300+ Test Cases)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17 (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Grant Gradle Execute Permissions
        run: chmod +x Android-App/gradlew

      - name: Build Android Debug APK
        run: |
          cd Android-App
          ./gradlew assembleDebug --no-daemon

      - name: Install Appium & Python Testing Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest Appium-Python-Client pytest-html pytest-xdist

      - name: Execute Appium Mobile Test Suite (300+ Scenarios)
        run: |
          python -m pytest tests/appium/test_mobile_suite.py \
            -v \
            --html=appium-test-report.html \
            --junitxml=appium-test-report.xml

      - name: Upload Android APK & Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appium-test-reports
          path: |
            Android-App/app/build/outputs/apk/debug/app-debug.apk
            appium-test-report.html
            appium-test-report.xml
          retention-days: 14
