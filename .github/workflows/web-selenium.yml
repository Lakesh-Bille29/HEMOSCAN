name: 🌐 Selenium Web Automation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  selenium-web-suite:
    name: Run Selenium WebDriver Suite (350 Tests)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Install Web Dependencies & Build React App
        run: |
          cd web
          npm ci
          npm run build

      - name: Start React Vite Preview Server in Background
        run: |
          cd web
          npm run preview -- --host 127.0.0.1 --port 5173 &
          sleep 5

      - name: Install Selenium Framework Dependencies
        run: |
          cd automation/selenium
          npm ci

      - name: Install Google Chrome & ChromeDriver
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Run Selenium Web Automation Suite (350 Tests)
        env:
          HEADLESS: "true"
          BROWSER: "chrome"
          WEB_BASE_URL: "http://127.0.0.1:5173"
        run: |
          cd automation/selenium
          npm test

      - name: Upload Selenium Test Artifacts & Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-reports
          path: |
            reports/selenium/
            reports/failures/selenium/
          retention-days: 14
