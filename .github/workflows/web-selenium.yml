name: 🌐 Selenium Web Automation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  selenium-web-suite:
    name: Run Selenium WebDriver Suite (350 Tests)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create Reports Directory
        run: mkdir -p reports/selenium reports/failures/selenium

      - name: Install Web Dependencies & Build React App
        run: |
          if [ -d "Web" ]; then cd Web; else cd web; fi
          npm ci
          npm run build

      - name: Start React Vite Preview Server in Background
        run: |
          if [ -d "Web" ]; then cd Web; else cd web; fi
          npm run preview -- --host 127.0.0.1 --port 5173 &
          for i in {1..15}; do
            if curl -s http://127.0.0.1:5173 > /dev/null; then
              echo "Vite Preview server ready on port 5173!"
              break
            fi
            echo "Waiting for Vite Preview server..."
            sleep 1
          done

      - name: Install Selenium Framework Dependencies
        run: |
          cd automation/selenium
          npm ci

      - name: Install Google Chrome Browser
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Run Selenium Web Automation Suite (350 Tests)
        env:
          HEADLESS: "true"
          BROWSER: "chrome"
          WEB_BASE_URL: "http://127.0.0.1:5173"
        run: |
          cd automation/selenium
          npm test

      - name: Upload Selenium Test Artifacts & Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-reports
          path: |
            reports/selenium/
            reports/failures/selenium/
          retention-days: 14
