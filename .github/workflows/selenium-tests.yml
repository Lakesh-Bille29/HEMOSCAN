name: 🌐 Selenium UI Testing Workflow

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  selenium-ui-tests:
    name: Run Selenium UI Test Suite (300+ Test Cases)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Google Chrome & ChromeDriver
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
          chromedriver --version || echo "ChromeDriver pre-installed"

      - name: Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest selenium pytest-html pytest-xdist

      - name: Start Local Web & Backend Server
        run: |
          cd Backend
          php -S 127.0.0.1:8000 &
          sleep 2

      - name: Execute Selenium UI Test Suite (300+ Scenarios)
        env:
          TEST_TARGET_URL: "http://127.0.0.1:8000"
        run: |
          python -m pytest tests/selenium/test_ui_suite.py \
            -v \
            --html=selenium-test-report.html \
            --junitxml=selenium-test-report.xml

      - name: Upload Selenium Test Reports & Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-test-reports
          path: |
            selenium-test-report.html
            selenium-test-report.xml
          retention-days: 14
