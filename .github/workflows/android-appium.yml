name: 📱 Appium Native Android Automation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  appium-android-suite:
    name: Run Appium 2.x UiAutomator2 Test Suite (350 Tests)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17 (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create Reports Directory
        run: mkdir -p reports/appium reports/failures/appium

      - name: Grant Gradle Permissions
        run: |
          if [ -f Android-App/gradlew ]; then chmod +x Android-App/gradlew; fi
          if [ -f app/gradlew ]; then chmod +x app/gradlew; fi

      - name: Build Android Debug APK
        run: |
          if [ -d "Android-App" ]; then
            cd Android-App
          else
            cd app
          fi
          ./gradlew assembleDebug --no-daemon -x test

      - name: Install Appium 2.x & Drivers
        run: |
          npm install -g appium@latest
          appium driver install uiautomator2 || true

      - name: Install Framework Dependencies
        run: |
          cd automation/appium
          npm ci

      - name: Start Appium Server in Background
        run: |
          appium --log-level error &
          for i in {1..15}; do
            if curl -s http://127.0.0.1:4723/status > /dev/null; then
              echo "Appium server ready on port 4723!"
              break
            fi
            echo "Waiting for Appium server..."
            sleep 1
          done

      - name: Run Appium Automation Suite (350 Tests)
        continue-on-error: true
        run: |
          cd automation/appium
          npm test

      - name: Upload Appium Test Artifacts & Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appium-reports
          path: |
            reports/appium/
            reports/failures/appium/
          retention-days: 14
