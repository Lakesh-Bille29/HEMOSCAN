name: 📱 Appium Native Android Automation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  appium-android-suite:
    name: Run Appium 2.x UiAutomator2 Test Suite (350 Tests)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17 (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'automation/appium/package.json'

      - name: Grant Gradle Permissions
        run: chmod +x Android-App/gradlew

      - name: Build Android Debug APK
        run: |
          cd Android-App
          ./gradlew assembleDebug --no-daemon -x test

      - name: Install Appium 2.x & Drivers
        run: |
          npm install -g appium@latest
          appium driver install uiautomator2

      - name: Install Framework Dependencies
        run: |
          cd automation/appium
          npm ci

      - name: Start Appium Server in Background
        run: |
          appium --log-level error &
          sleep 5

      - name: Run Appium Automation Suite (350 Tests)
        continue-on-error: true
        run: |
          cd automation/appium
          npm test

      - name: Upload Appium Test Artifacts & Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appium-reports
          path: |
            reports/appium/
            reports/failures/appium/
          retention-days: 14
