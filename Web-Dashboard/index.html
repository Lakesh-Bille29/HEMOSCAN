<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HemoScan - AI Diagnostics</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="toast-container"></div>

    <div class="auth-wrapper">
        <div class="glass-container auth-card" id="login-card">
            <div class="logo">
                <h1>🧠 HemoScan</h1>
                <p style="color: var(--text-secondary); margin-top: 5px;">AI-Powered Brain Diagnostics</p>
            </div>

            <form id="login-form">
                <div class="form-group">
                    <label for="login-email">Email Address</label>
                    <input type="email" id="login-email" class="form-control" placeholder="doctor@hospital.com" required>
                </div>
                <div class="form-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" class="form-control" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;" id="btn-login">Login</button>
            </form>

            <div class="text-center mt-3">
                <p style="font-size: 0.9rem; color: var(--text-secondary);">
                    Don't have an account? <a href="#" id="show-signup">Sign Up</a>
                </p>
            </div>
        </div>

        <div class="glass-container auth-card d-none" id="signup-card">
            <div class="logo">
                <h1>🧠 HemoScan</h1>
                <p style="color: var(--text-secondary); margin-top: 5px;">Create a Doctor Account</p>
            </div>

            <form id="signup-form">
                <div class="form-group">
                    <label for="signup-name">Full Name</label>
                    <input type="text" id="signup-name" class="form-control" placeholder="Dr. John Doe" required>
                </div>
                <div class="form-group">
                    <label for="signup-email">Email Address</label>
                    <input type="email" id="signup-email" class="form-control" placeholder="doctor@hospital.com" required>
                </div>
                <div class="form-group">
                    <label for="signup-mobile">Mobile Number</label>
                    <input type="tel" id="signup-mobile" class="form-control" placeholder="+1234567890" required>
                </div>
                <div class="form-group">
                    <label for="signup-gender">Gender</label>
                    <select id="signup-gender" class="form-control" required>
                        <option value="" disabled selected>Select Gender</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="signup-password">Password</label>
                    <input type="password" id="signup-password" class="form-control" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;" id="btn-signup">Sign Up</button>
            </form>

            <div class="text-center mt-3">
                <p style="font-size: 0.9rem; color: var(--text-secondary);">
                    Already have an account? <a href="#" id="show-login">Login</a>
                </p>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
